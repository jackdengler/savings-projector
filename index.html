  <script>
    /* Light / dark theme shared with Central Optimus (same origin): one
       localStorage key, co.theme = "dark" | "light" (default dark), applied
       before first paint and kept in step via the storage event. Keep this
       contract identical to central-optimus/launcher/theme.js. */
    (function () {
      var KEY = "co.theme";
      var BAR = { dark: "#0b0b0b", light: "#f5f2ea" };
      function read() {
        try {
          return localStorage.getItem(KEY) === "light" ? "light" : "dark";
        } catch (_) {
          return "dark";
        }
      }
      function apply(theme) {
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", BAR[theme]);
        document.dispatchEvent(new CustomEvent("co:theme", { detail: theme }));
      }
      apply(read());
      window.addEventListener("storage", function (e) {
        if (e.key === KEY) apply(read());
      });
      window.coTheme = {
        get: read,
        set: function (theme) {
          try {
            localStorage.setItem(KEY, theme);
          } catch (_) {}
          apply(theme);
        },
        toggle: function () {
          this.set(read() === "light" ? "dark" : "light");
        },
      };
    })();
  </script>

  <!--
    Storage shim.
    Inside the PWA shell the host injects `window.storage`, which persists to the
    private-data-storage repository. That injected implementation always wins.
    When this page is opened standalone (e.g. straight from GitHub Pages), we fall
    back to localStorage so the calculator still remembers your inputs.
  -->
  <script>
    if (!window.storage) {
      window.storage = {
        async get(key) {
          try {
            const value = localStorage.getItem(key);
            return value == null ? null : { value };
          } catch (e) { return null; }
        },
        async set(key, value) {
          try { localStorage.setItem(key, value); } catch (e) {}
        },
        async delete(key) {
          try { localStorage.removeItem(key); } catch (e) {}
        },
      };
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    /* ---------- Verified 2026 tax engine, single filer ---------- */
    // Federal brackets — IRS Rev. Proc. 2025-32 (2026 tax year)
    const FED = [
      { upTo: 12400, rate: 0.10 }, { upTo: 50400, rate: 0.12 },
      { upTo: 105700, rate: 0.22 }, { upTo: 201775, rate: 0.24 },
      { upTo: 256225, rate: 0.32 }, { upTo: 640600, rate: 0.35 },
      { upTo: Infinity, rate: 0.37 },
    ];
    // California brackets — latest published FTB single schedule
    const CA = [
      { upTo: 11079, rate: 0.01 }, { upTo: 26264, rate: 0.02 },
      { upTo: 41452, rate: 0.04 }, { upTo: 57542, rate: 0.06 },
      { upTo: 72724, rate: 0.08 }, { upTo: 371479, rate: 0.093 },
      { upTo: 445771, rate: 0.103 }, { upTo: 742953, rate: 0.113 },
      { upTo: Infinity, rate: 0.123 },
    ];
    const FED_STD = 16100, CA_STD = 5706, SS_CAP = 184500;
    const bracket = (x, b, f) => {
      let t = 0, prev = 0;
      for (const { upTo, rate } of b) { const cap = upTo * f; if (x <= prev) break; t += (Math.min(x, cap) - prev) * rate; prev = cap; }
      return t;
    };
    function personTax(wages, pretax, f) {
      const fed = bracket(Math.max(0, wages - pretax - FED_STD * f), FED, f);
      const ca = bracket(Math.max(0, wages - pretax - CA_STD * f), CA, f);
      const ss = 0.062 * Math.min(wages, SS_CAP * f);
      const medicare = 0.0145 * wages + 0.009 * Math.max(0, wages - 200000); // $200k threshold is not indexed
      const sdi = 0.013 * wages; // CA SDI 2026, no wage cap
      return fed + ca + ss + medicare + sdi;
    }

    const YOUR_401K = 24500, IRA = 7500, LIMIT_415C = 72000; // 2026 IRS limits (elective deferral / IRA / DC annual additions)
    const STORE_KEY = "savings_inputs_v2";

    /* Per-year override / "raise" engine — walks the trajectory year by year so it
       can layer three kinds of assumption on top of the year-1 slider value:
         • valuePins  — an absolute $ (or %) level pinned at a given year; from there
                        the path re-bases off the pinned number.
         • growthPins — a growth-rate change effective from a given year onward
                        (overrides the field's flat baseGrow for every later step).
         • cap        — an absolute ceiling (0 = none); the level never grows past it.
       baseGrow is 0 for percentage fields like bonus %, so they hold flat between pins. */
    function levelPath(defaultVal, baseGrow, yr, valuePins, growthPins, cap) {
      const growAt = (y) => { let r = baseGrow; for (const g of growthPins) if (g.year <= y) r = g.value; return r; }; // most recent rate ≤ y
      const clamp = (v) => (cap > 0 ? Math.min(v, cap) : v);
      const pinAt = (y, v) => { for (const p of valuePins) if (p.year === y) v = p.value; return v; };
      let v = clamp(pinAt(1, defaultVal));
      for (let y = 2; y <= yr; y++) { v = clamp(pinAt(y, v * (1 + growAt(y - 1) / 100))); } // grow into year y at the rate in effect the prior year
      return v;
    }

    const fmt = (n) => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US");
    const fmtC = (n) => {
      const s = n < 0 ? "-" : "", a = Math.abs(n);
      if (a >= 1e6) return s + "$" + (a / 1e6).toFixed(2) + "M";
      if (a >= 1e4) return s + "$" + Math.round(a / 1e3) + "k";
      return s + "$" + Math.round(a).toLocaleString("en-US");
    };

    function computeYear(p, yr) {
      const eg = Math.pow(1 + p.expGrow / 100, yr - 1);
      const f = Math.pow(1 + (p.infl || 0) / 100, yr - 1); // indexes brackets, deductions & contribution limits
      const deferLimit = YOUR_401K * f, your401k = Math.min(p.your401kAmt ?? YOUR_401K, YOUR_401K) * f, ira = IRA * f, cap415 = LIMIT_415C * f;

      // resolve each field through any per-year pins (overrides)
      const ov = p.overrides || [];
      const pins = (field) => ov.filter((o) => o.field === field && Number(o.year) >= 1)
        .map((o) => ({ year: Number(o.year), value: Number(o.value) })).sort((a, b) => a.year - b.year);
      const yourGP = pins("yourGrowth"), herGP = pins("herGrowth"); // per-year growth-rate changes
      const base = levelPath(p.base, p.yourGrow, yr, pins("base"), yourGP, p.yourCap || 0);       // $ level, grows, capped
      const bonusPct = levelPath(p.bonusPct, 0, yr, pins("bonus"), [], 0);                          // % rate, flat until next pin
      const esop = levelPath(p.esop, p.yourGrow, yr, pins("esop"), yourGP, 0);                      // $ level, grows (uncapped)
      const herSal = levelPath(p.herSal, p.herGrow, yr, pins("herSal"), herGP, p.herCap || 0);      // $ level, grows, capped
      const herBonusPct = levelPath(p.herBonusPct || 0, 0, yr, pins("herBonus"), [], 0);            // % rate

      const bonus = base * (bonusPct / 100), herBonus = herSal * (herBonusPct / 100);
      const yourWages = base + bonus, herWages = herSal + herBonus;
      const her401k = Math.min(herSal * ((p.her401kPct ?? 3) / 100), deferLimit), yourMatch = base * ((p.yourMatchPct ?? 4) / 100), herMatch = herSal * ((p.herMatchPct ?? 3) / 100); // contributions/match as % of salary
      const yourTax = personTax(yourWages, your401k, f), herTax = personTax(herWages, her401k, f);
      const takeHome = (yourWages - your401k - yourTax) + (herWages - her401k - herTax);
      const fixed = p.fixedMo * 12 * eg, variable = p.varMo * 12 * eg, big = p.big * eg;
      const spending = fixed + variable + big;
      // §415(c) annual-additions cap: employee deferral + employer match + ESOP can't exceed the limit
      const yourAddRaw = your401k + yourMatch + esop, herAddRaw = her401k + herMatch;
      const yourAdd = Math.min(yourAddRaw, cap415), herAdd = Math.min(herAddRaw, cap415);
      const capHit = yourAddRaw > cap415 || herAddRaw > cap415;
      const liquid = takeHome - spending - ira;
      const retirement = yourAdd + herAdd + ira;
      const totalSaved = retirement + liquid;
      return { base, bonus, esop, herSal, herBonus, fixed, variable, big, spending, liquid, retirement,
        totalSaved, gross: yourWages + esop + herWages, tax: yourTax + herTax,
        yourInc: yourWages + esop, herInc: herWages, yourTax, herTax,
        your401kTotal: yourAdd, her401kTotal: herAdd, ira, capHit };
    }

    /* smooth path through points */
    function smooth(pts) {
      if (pts.length < 2) return pts.length ? `M ${pts[0].x} ${pts[0].y}` : "";
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6}, ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6}, ${p2.x} ${p2.y}`;
      }
      return d;
    }

    /* Central Optimus roles (tokens live in :root in <head>, so light/dark swap in
       one place). Old names kept: terra = accent (the main series / totals),
       sage = retirement / good, brass = the app's amber marker. Text never uses
       --faint (under 4.5:1), so "soft" and "mute" both land on --muted.
       saveTableImage resolves these to hex, since an SVG image can't see page CSS. */
    const C = { paper: "var(--ground)", ink: "var(--ink)", ink2: "var(--ink-2)", card: "var(--surface)", border: "var(--line)",
      terra: "var(--accent-ink)", terraDk: "var(--accent-ink)", sage: "var(--good)", brass: "var(--brand-ink)",
      mute: "var(--muted)", soft: "var(--muted)", warn: "var(--warn)", bad: "var(--bad)" };

    // Editable number field: shows thousands-commas at rest, lets you type freely
    // (empty/partial allowed, no snapping to 0), commits live while it parses,
    // and clamps to min/max only on blur so it never "maxes out" mid-type.
    function NumInput({ value, onCommit, min, max, decimals, align, style, label }) {
      const [focused, setFocused] = useState(false);
      const [draft, setDraft] = useState("");
      const display = focused ? draft : Number(value).toLocaleString("en-US", { maximumFractionDigits: 3 });
      const commit = () => {
        setFocused(false);
        let n = draft.trim() === "" ? (min != null ? min : 0) : Number(draft);
        if (!isFinite(n)) n = value;
        if (min != null) n = Math.max(min, n);
        if (max != null) n = Math.min(max, n);
        n = decimals ? Math.round(n * 1e6) / 1e6 : Math.round(n);
        onCommit(n);
      };
      return (
        <input type="text" inputMode={decimals ? "decimal" : "numeric"} value={display} aria-label={label}
          onFocus={(e) => { setFocused(true); setDraft(String(value)); requestAnimationFrame(() => e.target.select()); }}
          onChange={(e) => {
            const cleaned = e.target.value.replace(decimals ? /[^0-9.]/g : /[^0-9]/g, "");
            setDraft(cleaned);
            if (cleaned !== "" && isFinite(Number(cleaned))) onCommit(Number(cleaned)); // live, unclamped
          }}
          onBlur={commit}
          onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
          className="sp-num"
          style={{ width: `${Math.max(2.5, display.length + 1)}ch`, boxSizing: "content-box", padding: "1px 1px",
            textAlign: align || "right", ...style }} />
      );
    }
    // `tint` is still accepted from call sites, but every slider now shares the
    // Optimus fill (yellow in dark, mustard in light) so the page reads as one system.
    function Slider({ label, value, setValue, min, max, step, prefix, suffix, hint, tint }) {
      const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
      return (
        <div className="sp-slider">
          <div className="sp-slider-row">
            <span className="sp-label">{label}</span>
            <span className="sp-val">
              {prefix && <span className="sp-unit">{prefix}</span>}
              <NumInput value={value} onCommit={setValue} min={0} decimals={!Number.isInteger(step)} label={label}
                style={{ fontSize: 17, minWidth: "2ch", padding: "0 1px 1px" }} />
              {suffix && <span className="sp-unit sp-suffix">{suffix}</span>}
            </span>
          </div>
          <input type="range" className="sp-range" aria-label={label} min={min} max={max} step={step} value={Math.min(Math.max(value, min), max)}
            onChange={(e) => setValue(Number(e.target.value))}
            style={{ background: `linear-gradient(90deg,var(--range-fill) ${pct}%,var(--range-track) ${pct}%)` }} />
          {hint && <div className="sp-hint">{hint}</div>}
        </div>
      );
    }
    function Toggle({ label, value, setValue, on, off }) {
      return (
        <div className="sp-toggle">
          <span className="sp-label">{label}</span>
          <div className="sp-seg">
            {[[true, on], [false, off]].map(([v, lab]) => (
              <button key={lab} onClick={() => setValue(v)} aria-pressed={value === v} className={value === v ? "is-on" : undefined}>{lab}</button>
            ))}
          </div>
        </div>
      );
    }
    function Row({ label, value, bold, accent }) {
      return (
        <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid var(--line-soft)",
          fontWeight: bold ? 700 : 400, color: accent ? C.terra : C.ink2, fontSize: bold ? 15 : 13.5 }}>
          <span>{label}</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{value}</span>
        </div>
      );
    }
    function Section({ title, right, children, delay }) {
      return (
        <section className="sp-section rise" style={{ animationDelay: delay }}>
          <div className="sp-section-head">
            <h2 className="sp-section-title">{title}</h2>
            {right}
          </div>
          {children}
        </section>
      );
    }
    // Light / dark switch for the shared co.theme key (the head script owns it);
    // relabels itself whenever the theme changes, here or in another window.
    function ThemeToggle() {
      const read = () => (window.coTheme ? window.coTheme.get() : "dark");
      const [theme, setTheme] = useState(read);
      useEffect(() => {
        const onTheme = (e) => setTheme((e && e.detail) || read());
        document.addEventListener("co:theme", onTheme);
        return () => document.removeEventListener("co:theme", onTheme);
      }, []);
      const light = theme === "light";
      return (
        <button id="toggle-theme" type="button" className="sp-icon" onClick={() => window.coTheme && window.coTheme.toggle()}
          aria-label={light ? "Switch to dark mode" : "Switch to light mode"} aria-pressed={light}>
          <svg className="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" />
          </svg>
          <svg className="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
          </svg>
        </button>
      );
    }

    const DEFAULTS = { base: 160000, bonusPct: 30, esop: 30000, herSal: 80000, herBonusPct: 0, fixedMo: 5000, varMo: 3500, big: 0,
      yourGrow: 4, herGrow: 3, expGrow: 3, invReturn: 6, years: 15, startRet: 0, startLiq: 0,
      feRatio: 28, mortRate: 6.5, inclBonus: true, propTax: 1.25, insRate: 0.4, emFund: 50000, pmiRate: 0.6, closeCost: 3, pitiCap: 0, infl: 2.7,
      your401kAmt: 24500, yourMatchPct: 4, her401kPct: 3, herMatchPct: 3, liqTaxDrag: 15, retBand: 2, realDollars: false,
      yourCap: 0, herCap: 0, overrides: [] };

    // override field catalog — label, whether it's a % value, max, and (for growth) a rate flag
    const OV_FIELDS = {
      base:       { label: "Your base",      pct: false },
      bonus:      { label: "Your bonus",     pct: true,  max: 100 },
      esop:       { label: "Your ESOP",      pct: false },
      herSal:     { label: "Her salary",     pct: false },
      herBonus:   { label: "Her bonus",      pct: true,  max: 100 },
      yourGrowth: { label: "Your growth/yr", pct: true,  max: 25, rate: true },
      herGrowth:  { label: "Her growth/yr",  pct: true,  max: 25, rate: true },
    };

    function SavingsCalculator() {
      const [s, setS] = useState(DEFAULTS);
      const [hydrated, setHydrated] = useState(false);
      const [saved, setSaved] = useState(false);
      const set = (k) => (v) => setS((o) => ({ ...o, [k]: v }));

      useEffect(() => {
        (async () => {
          try { const r = await window.storage.get(STORE_KEY); if (r && r.value) setS({ ...DEFAULTS, ...JSON.parse(r.value) }); }
          catch (e) {}
          setHydrated(true);
        })();
      }, []);
      useEffect(() => {
        if (!hydrated) return;
        (async () => { try { await window.storage.set(STORE_KEY, JSON.stringify(s)); setSaved(true); setTimeout(() => setSaved(false), 1200); } catch (e) {} })();
      }, [s, hydrated]);
      const reset = async () => { setS(DEFAULTS); try { await window.storage.delete(STORE_KEY); } catch (e) {} };

      // per-year override handlers
      const ovs = s.overrides || [];
      const addOverride = () => setS((o) => ({ ...o, overrides: [...(o.overrides || []),
        { id: Date.now() + Math.random(), year: Math.min(o.years, 3), field: "base", value: o.base }] }));
      const updOverride = (id, k, v) => setS((o) => ({ ...o, overrides: (o.overrides || []).map((x) => x.id === id ? { ...x, [k]: v } : x) }));
      const delOverride = (id) => setS((o) => ({ ...o, overrides: (o.overrides || []).filter((x) => x.id !== id) }));
      // switching field types: snap a stale value into the new field's sane range
      const changeField = (o, field) => {
        const m = OV_FIELDS[field]; let v = o.value;
        if (m.rate) { if (!(v > 0) || v > m.max) v = 4; }            // growth rate default
        else if (m.pct) { if (v > 100) v = 30; }                      // bonus %
        else if (v <= 100) v = field === "esop" ? s.esop : s.base;    // $ level — leave large numbers, fill tiny ones
        updOverride(o.id, "field", field); if (v !== o.value) updOverride(o.id, "value", v);
      };

      const p = { ...s };
      const years = Math.max(1, Math.round(s.years) || 1); // a cleared/typed-0 field must never empty the projection
      const y1 = computeYear(p, 1);
      const negative = y1.liquid < 0;

      const r = s.mortRate / 100 / 12, n = 360;
      const pmtFactor = r > 0 ? r / (1 - Math.pow(1 + r, -n)) : 1 / n; // monthly P&I per $1 of loan
      const tiRate = (s.propTax + s.insRate) / 100 / 12; // monthly taxes+insurance per $1 of home value
      const DOWN = 0.20; // conventional threshold below which PMI usually applies

      // Liquid sits in a taxable brokerage, so its yearly growth is taxed (dividends +
      // realized gains); retirement compounds tax-deferred. `liqTaxDrag` is that haircut.
      const liqReturn = (ret) => (ret / 100) * (1 - (s.liqTaxDrag || 0) / 100);

      const proj = [];
      let retBal = s.startRet, liqBal = s.startLiq, contrib = s.startRet + s.startLiq;
      for (let yr = 1; yr <= years; yr++) {
        const cy = computeYear(p, yr);
        retBal = retBal * (1 + s.invReturn / 100) + cy.retirement;
        liqBal = liqBal * (1 + liqReturn(s.invReturn)) + cy.liquid;
        contrib += cy.totalSaved;
        const qualInc = cy.base + cy.herSal + (s.inclBonus ? cy.bonus + cy.herBonus : 0);
        const ratioPITI = (s.feRatio / 100) * qualInc / 12;
        const maxPITI = s.pitiCap > 0 ? Math.min(ratioPITI, s.pitiCap) : ratioPITI; // personal ceiling caps the lender ratio
        const pitiCapped = s.pitiCap > 0 && s.pitiCap < ratioPITI;
        const cash = Math.max(0, liqBal - s.emFund);      // cash above the e-fund — splits between down payment + closing costs
        const cc = (s.closeCost || 0) / 100;              // closing costs as % of purchase price
        const pmiMoRate = s.pmiRate / 100 / 12;           // monthly PMI per $1 of loan
        // price = (cash + loan) / (1 + cc) since closing eats cc·price of the cash; tiAdj is TI per $1 of (cash + loan)
        const tiAdj = tiRate / (1 + cc);
        const solveLoan = (extra) => (maxPITI - tiAdj * cash) / (pmtFactor + extra + tiAdj);
        let loan = solveLoan(0), pmiMo = 0, affordHome;
        if (loan <= 0) {                                  // cash-rich / payment-constrained: no loan needed
          loan = 0;
          affordHome = Math.min(maxPITI / tiRate, cash / (1 + cc));
        } else {
          affordHome = (cash + loan) / (1 + cc);
          // under 20% down -> PMI applies, re-solve with it eating the budget
          if (affordHome > 0 && (affordHome - loan) / affordHome < DOWN && pmiMoRate > 0) {
            loan = solveLoan(pmiMoRate);
            affordHome = (cash + loan) / (1 + cc);
            pmiMo = pmiMoRate * loan;
          }
        }
        const closing = cc * affordHome;
        const down = Math.max(0, affordHome - loan);      // = cash - closing
        const pi = pmtFactor * loan, ti = tiRate * affordHome;
        const downPct = affordHome > 0 ? down / affordHome : 0;
        const pmiZone = pmiMo > 0;
        const yrPins = ovs.filter((o) => Number(o.year) === yr);
        const pinNote = yrPins.map((o) => `${OV_FIELDS[o.field] ? OV_FIELDS[o.field].label : o.field} → ${OV_FIELDS[o.field] && OV_FIELDS[o.field].pct ? o.value + "%" : fmtC(o.value)}`).join(" · ");
        proj.push({ yr, yourInc: cy.yourInc, herInc: cy.herInc, gross: cy.gross,
          yourTax: cy.yourTax, herTax: cy.herTax, tax: cy.tax, spending: cy.spending,
          liqSaved: cy.liquid, retSaved: cy.retirement, savedTot: cy.totalSaved,
          bal: retBal + liqBal, retBalY: retBal, liqBalY: liqBal, contrib, capHit: cy.capHit,
          pinned: yrPins.length > 0, pinNote,
          qualInc, maxPITI, pitiCapped, down, loan, affordHome, closing, pi, ti, pmiMo, downPct, pmiZone });
      }
      // "Today's dollars": deflate every nominal figure by the inflation factor of its
      // own year so a long-horizon balance is shown in current buying power. Display-only —
      // the compounding above already happened in nominal terms, so this just rescales.
      const defl = (yr) => s.realDollars ? Math.pow(1 + (s.infl || 0) / 100, -(yr - 1)) : 1;
      const DOLLAR_KEYS = ["yourInc", "herInc", "gross", "yourTax", "herTax", "tax", "spending",
        "liqSaved", "retSaved", "savedTot", "bal", "retBalY", "liqBalY", "contrib",
        "qualInc", "maxPITI", "down", "loan", "affordHome", "closing", "pi", "ti", "pmiMo"];
      if (s.realDollars) for (const d of proj) { const k = defl(d.yr); for (const key of DOLLAR_KEYS) d[key] *= k; }

      const lastRow = proj[proj.length - 1];
      const endBal = lastRow.bal, endRet = lastRow.retBalY, endLiq = lastRow.liqBalY;
      const totalContrib = lastRow.contrib, growth = endBal - totalContrib;

      const m1 = proj[0], eY = lastRow;

      // ±band scenario: re-run the balance path at invReturn ± retBand (same deflator),
      // shading the gap so the single-point return reads as a range, not a promise.
      const totalSeries = (ret) => {
        let rb = s.startRet, lb = s.startLiq;
        return proj.map((d) => {
          const cy = computeYear(p, d.yr);
          rb = rb * (1 + ret / 100) + cy.retirement;
          lb = lb * (1 + liqReturn(ret)) + cy.liquid;
          return (rb + lb) * defl(d.yr);
        });
      };
      const band = s.retBand > 0
        ? { lo: totalSeries(Math.max(0, s.invReturn - s.retBand)), hi: totalSeries(s.invReturn + s.retBand) }
        : null;

      /* chart */
      const W = 480, H = 170, padX = 10, padY = 14;
      const maxV = Math.max(...proj.map((d) => d.bal), 1, ...(band ? band.hi : []));
      const minV = Math.min(0, ...proj.map((d) => d.bal), ...(band ? band.lo : []));
      const sx = (i) => padX + (i / (proj.length - 1 || 1)) * (W - 2 * padX);
      const sy = (v) => H - padY - ((v - minV) / (maxV - minV || 1)) * (H - 2 * padY);
      const baseY = sy(minV);
      const totPts = proj.map((d, i) => ({ x: sx(i), y: sy(d.bal) }));
      const retPts = proj.map((d, i) => ({ x: sx(i), y: sy(d.retBalY) }));
      const totLine = smooth(totPts), retLine = smooth(retPts);
      const retArea = retLine + ` L ${retPts[retPts.length - 1].x} ${baseY} L ${retPts[0].x} ${baseY} Z`;
      const retRev = [...retPts].reverse();
      const liqArea = totLine + ` L ${retRev[0].x} ${retRev[0].y}` + smooth(retRev).replace(`M ${retRev[0].x} ${retRev[0].y}`, "") + " Z";
      const bandHiPts = band ? band.hi.map((v, i) => ({ x: sx(i), y: sy(v) })) : null;
      const bandLoPts = band ? band.lo.map((v, i) => ({ x: sx(i), y: sy(v) })) : null;
      const loRev = bandLoPts ? [...bandLoPts].reverse() : null;
      const bandArea = band ? smooth(bandHiPts) + ` L ${loRev[0].x} ${loRev[0].y} ` + smooth(loRev).replace(`M ${loRev[0].x} ${loRev[0].y}`, "") + " Z" : "";
      const ticks = [0, 1, 2, 3].map((k) => minV + ((maxV - minV) * k) / 3);
      const last = totPts[totPts.length - 1];

      /* year-by-year table styling helpers (grouped header) */
      const HDIV = "1px solid var(--line)", BDIV = "1px solid var(--line-soft)";
      const grp = (color, div) => ({ padding: "8px 9px 5px", textAlign: "center", fontWeight: 500, color,
        letterSpacing: ".12em", textTransform: "uppercase", fontSize: 10.5,
        borderLeft: div ? HDIV : "none", borderBottom: "1px solid var(--line-soft)" });
      const sub = (div) => ({ padding: "5px 9px 7px", textAlign: "right", fontWeight: 500, fontSize: 10.5,
        letterSpacing: ".06em", textTransform: "uppercase", whiteSpace: "nowrap", borderLeft: div ? HDIV : "none" });
      const bc = (extra, div) => ({ padding: "7px 8px", textAlign: "right",
        borderLeft: div ? BDIV : "none", ...(extra || {}) });

      /* Render the year-by-year table to a PNG straight from the projection data — no
         html2canvas, no DOM scrape, so it stays a single dependency-free file. On iPhone
         this routes through the native share sheet (Save Image / Messages); elsewhere it
         downloads. The image reflects the current today's-$ / nominal state. */
      const saveTableImage = () => {
        // The SVG is rasterized as an image, which can't see this page's CSS: resolve
        // the Optimus tokens to hex for whichever theme is showing right now.
        const cs = getComputedStyle(document.documentElement);
        const tok = (name, fb) => cs.getPropertyValue(name).trim() || fb;
        const X = { ground: tok("--ground", "#0b0b0b"), surface: tok("--surface", "#151515"), ink: tok("--ink", "#f5f2ea"),
          ink2: tok("--ink-2", "#cfcac0"), muted: tok("--muted", "#a8a49b"), line: tok("--line", "#3a3a3a"),
          accent: tok("--accent-ink", "#ffe500"), good: tok("--good", "#5fd38a"), warn: tok("--warn", "#ffb612"),
          bad: tok("--bad", "#ff5a4f"), brand: tok("--brand", "#b7791f"), brandInk: tok("--brand-ink", "#b7791f") };
        const GCOL = { Income: X.brandInk, Taxes: X.accent, Savings: X.good, Balance: X.accent, Housing: X.brandInk };
        const cols = [
          { k: "yr", label: "Yr", grp: "" },
          { k: "yourInc", label: "You", grp: "Income" }, { k: "herInc", label: "Her", grp: "Income" }, { k: "gross", label: "Total", grp: "Income" },
          { k: "yourTax", label: "You", grp: "Taxes" }, { k: "herTax", label: "Her", grp: "Taxes" }, { k: "tax", label: "Total", grp: "Taxes" },
          { k: "spending", label: "Spend", grp: "" },
          { k: "liqSaved", label: "Liquid", grp: "Savings" }, { k: "retSaved", label: "Retire", grp: "Savings" }, { k: "savedTot", label: "Total", grp: "Savings" },
          { k: "liqBalY", label: "Liquid", grp: "Balance" }, { k: "retBalY", label: "Retire", grp: "Balance" }, { k: "bal", label: "Total", grp: "Balance" },
          { k: "maxPITI", label: "PITI/mo", grp: "Housing" }, { k: "affordHome", label: "Afford", grp: "Housing" },
        ];
        const cellColor = (k, d) => {
          if (k === "liqSaved") return d.liqSaved < 0 ? X.bad : X.ink2;
          if (k === "retSaved" || k === "retBalY") return X.good;
          if (k === "savedTot" || k === "gross" || k === "maxPITI") return X.ink;
          if (k === "tax") return X.ink2;
          if (k === "yourTax" || k === "herTax" || k === "liqBalY") return X.muted;
          if (k === "bal") return X.accent;
          if (k === "affordHome") return d.pmiZone ? X.warn : X.good;
          return X.ink2;
        };
        const bold = (k) => ["gross", "tax", "savedTot", "bal", "affordHome"].includes(k);
        const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const yrW = 46, colW = 78, padL = 16, padT = 16;
        let cx = padL;
        const xs = cols.map((c, i) => { const w = i === 0 ? yrW : colW; const o = { ...c, x: cx, w }; cx += w; return o; });
        const totalW = cx + padL;
        const titleH = 56, gH = 24, sH = 22, rowH = 26;
        const headTop = padT + titleH, bodyTop = headTop + gH + sH;
        const totalH = bodyTop + proj.length * rowH + 16;
        let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" font-family="'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace">`;
        svg += `<rect width="${totalW}" height="${totalH}" fill="${X.ground}"/>`;
        svg += `<rect width="${totalW}" height="6" fill="${X.brand}"/>`;
        svg += `<text x="${padL}" y="${padT + 24}" font-size="20" font-weight="700" fill="${X.ink}">Savings &amp; Growth — year by year</text>`;
        const cap = `${years}-yr projection · ${s.invReturn}% return${s.retBand > 0 ? ` ±${s.retBand}` : ""} · ${s.realDollars ? "today's dollars" : "nominal dollars"}`;
        svg += `<text x="${padL}" y="${padT + 46}" font-size="12.5" fill="${X.muted}">${esc(cap)}</text>`;
        svg += `<rect x="0" y="${headTop}" width="${totalW}" height="${gH + sH}" fill="${X.surface}"/>`;
        svg += `<rect x="0" y="${headTop + gH - 1}" width="${totalW}" height="1" fill="${X.line}"/>`;
        svg += `<rect x="0" y="${bodyTop - 2}" width="${totalW}" height="2" fill="${X.ink}"/>`;
        // group bands
        for (let i = 0; i < xs.length;) {
          const g = xs[i].grp;
          if (!g) {
            svg += `<text x="${xs[i].x + xs[i].w / 2}" y="${headTop + (gH + sH) / 2 + 4}" font-size="11" font-weight="700" fill="${X.ink}" text-anchor="middle">${esc(xs[i].label)}</text>`;
            i++; continue;
          }
          let j = i; while (j < xs.length && xs[j].grp === g) j++;
          const x0 = xs[i].x, x1 = xs[j - 1].x + xs[j - 1].w;
          svg += `<text x="${(x0 + x1) / 2}" y="${headTop + 16}" font-size="10.5" font-weight="700" fill="${GCOL[g] || X.muted}" text-anchor="middle" letter-spacing="1">${esc(g.toUpperCase())}</text>`;
          for (let q = i; q < j; q++) svg += `<text x="${xs[q].x + xs[q].w - 6}" y="${headTop + gH + 15}" font-size="11" font-weight="600" fill="${X.muted}" text-anchor="end">${esc(xs[q].label)}</text>`;
          i = j;
        }
        // rows
        proj.forEach((d, r) => {
          const ry = bodyTop + r * rowH;
          svg += `<rect x="0" y="${ry}" width="${totalW}" height="${rowH}" fill="${r % 2 ? X.surface : X.ground}"/>`;
          xs.forEach((c) => {
            if (c.k === "yr") {
              svg += `<text x="${c.x + 8}" y="${ry + 17}" font-size="11.5" font-weight="700" fill="${X.brandInk}">${d.yr}${d.pinned ? " •" : ""}</text>`;
            } else {
              svg += `<text x="${c.x + c.w - 6}" y="${ry + 17}" font-size="11.5" font-weight="${bold(c.k) ? 700 : 500}" fill="${cellColor(c.k, d)}" text-anchor="end">${esc(fmtC(d[c.k]))}</text>`;
            }
          });
        });
        svg += `</svg>`;
        const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
        const img = new Image();
        img.onload = () => {
          const scale = 2, canvas = document.createElement("canvas");
          canvas.width = totalW * scale; canvas.height = totalH * scale;
          const ctx = canvas.getContext("2d");
          ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob(async (png) => {
            if (!png) return;
            const file = new File([png], "savings-projection.png", { type: "image/png" });
            try {
              if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Savings projection" }); return; }
            } catch (e) { if (e && e.name === "AbortError") return; }
            const href = URL.createObjectURL(png), a = document.createElement("a");
            a.href = href; a.download = "savings-projection.png"; a.target = "_blank";
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(href), 4000);
          }, "image/png");
        };
        img.onerror = () => { URL.revokeObjectURL(url); };
        img.src = url;
      };

      return (
        <div className="sp-app">

          {/* Header */}
          <header className="sp-head rise">
            <div className="sp-head-top">
              <div className="sp-kicker">Los Angeles · Two Incomes</div>
              <div className="sp-head-actions">
                <span className={"sp-saved" + (saved ? " is-saved" : "")}>
                  {saved ? "✓ saved" : "auto-saves"}
                </span>
                <ThemeToggle />
              </div>
            </div>
            <h1 className="sp-title">Savings <span className="sp-amp">&amp;</span> Growth</h1>
          </header>

          {/* Hero: the Savings band (launcher colour), red when year 1 overspends */}
          <div className={"sp-hero rise" + (negative ? " is-neg" : "")} style={{ animationDelay: ".05s" }}>
            <div className="sp-hero-label">Saved · Year 1</div>
            <div className="sp-hero-num">{fmt(y1.totalSaved)}</div>
            <div className="sp-hero-meta">
              <span><b>{((y1.totalSaved / y1.gross) * 100).toFixed(0)}%</b> savings rate</span>
              <span>{fmtC(y1.retirement)} retirement</span>
              <span>{fmtC(Math.max(y1.liquid, 0))} liquid</span>
            </div>
            {negative && <div className="sp-hero-warn">⚠ Overspending take-home by {fmt(-y1.liquid)}</div>}
          </div>

          {/* Projection */}
          <div className="sp-proj rise" style={{ animationDelay: ".1s" }}>
            <div className="sp-proj-head">
              <div className="sp-label">Projected · year {years}{s.realDollars ? " · today's $" : ""}</div>
              <div className="sp-proj-sub">{fmtC(totalContrib)} in · <span style={{ color: C.sage, fontWeight: 500 }}>{fmtC(growth)} growth</span></div>
            </div>
            <div className="sp-bignum">{fmtC(endBal)}</div>

            <div className="sp-tiles">
              {[["Retirement", endRet, C.sage], ["Liquid", endLiq, C.terra]].map(([lab, val, col]) => (
                <div key={lab} className="sp-tile" style={{ "--mark": col }}>
                  <div className="sp-tile-label">{lab}</div>
                  <div className="sp-tile-num" style={{ color: col }}>{fmtC(val)}</div>
                </div>
              ))}
            </div>

            {/* Same geometry as before; only colours moved to tokens. Clipped to its
                box so an out-of-range series can't paint over the page. */}
            <svg viewBox={`0 0 ${W} ${H}`} className="sp-chart">
              <defs>
                <linearGradient id="ret" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" style={{ stopColor: C.sage, stopOpacity: 0.4 }} />
                  <stop offset="100%" style={{ stopColor: C.sage, stopOpacity: 0.1 }} />
                </linearGradient>
                <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" style={{ stopColor: C.terra, stopOpacity: 0.34 }} />
                  <stop offset="100%" style={{ stopColor: C.terra, stopOpacity: 0.06 }} />
                </linearGradient>
              </defs>
              {ticks.map((v, i) => (
                <g key={i}>
                  <line x1={padX} y1={sy(v)} x2={W - padX} y2={sy(v)} style={{ stroke: "var(--ch-grid)" }} strokeWidth="1" />
                  <text x={padX} y={sy(v) - 4} fontSize="11" style={{ fill: C.soft, fontFamily: "var(--mono)" }}>{fmtC(v)}</text>
                </g>
              ))}
              {band && <path d={bandArea} style={{ fill: "var(--ch-band)" }} />}
              {band && <path d={smooth(bandHiPts)} fill="none" style={{ stroke: C.terra }} strokeWidth="1" strokeDasharray="2 3" opacity="0.6" />}
              {band && <path d={smooth(bandLoPts)} fill="none" style={{ stroke: C.terra }} strokeWidth="1" strokeDasharray="2 3" opacity="0.6" />}
              <path d={liqArea} fill="url(#liq)" />
              <path d={retArea} fill="url(#ret)" />
              <path d={retLine} fill="none" style={{ stroke: C.sage }} strokeWidth="2" />
              <path d={totLine} fill="none" style={{ stroke: C.terra }} strokeWidth="2.6" />
              <circle cx={last.x} cy={last.y} r="4.5" style={{ fill: C.terra, stroke: C.paper }} strokeWidth="2" />
            </svg>
            <div className="sp-axis">
              <span>Yr 1</span><span>Yr {Math.ceil(years / 2)}</span><span>Yr {years}</span>
            </div>
            <div className="sp-legend">
              <span className="sp-key"><i style={{ background: C.sage }} /> retirement</span>
              <span className="sp-key"><i style={{ background: C.terra }} /> liquid</span>
              <span>· {s.invReturn}% return{band ? ` ±${s.retBand}` : ""}</span>
              {s.realDollars && <span style={{ color: C.sage }}>· today's $</span>}
            </div>
          </div>

          <Section title="Income" delay=".12s">
            <Slider label="Your base" value={s.base} setValue={set("base")} min={50000} max={400000} step={5000} prefix="$" />
            <Slider label="Your bonus %" value={s.bonusPct} setValue={set("bonusPct")} min={0} max={60} step={1} suffix="%" hint={"= " + fmt(s.base * s.bonusPct / 100) + " bonus"} />
            <Slider label="Your ESOP" value={s.esop} setValue={set("esop")} min={0} max={80000} step={1000} prefix="$" tint={C.sage} />
            <Slider label="Her salary" value={s.herSal} setValue={set("herSal")} min={0} max={250000} step={5000} prefix="$" />
            <Slider label="Her bonus %" value={s.herBonusPct} setValue={set("herBonusPct")} min={0} max={60} step={1} suffix="%" hint={"= " + fmt(s.herSal * s.herBonusPct / 100) + " bonus"} />
          </Section>

          <Section title="Growth · per person" delay=".14s">
            <Slider label="Your income growth / yr" value={s.yourGrow} setValue={set("yourGrow")} min={0} max={12} step={0.5} suffix="%" tint={C.brass} />
            <Slider label="Her income growth / yr" value={s.herGrow} setValue={set("herGrow")} min={0} max={12} step={0.5} suffix="%" tint={C.brass} />
            <Slider label="Your income cap" value={s.yourCap} setValue={set("yourCap")} min={0} max={600000} step={10000} prefix="$" tint={C.sage}
              hint={s.yourCap > 0 ? "Your base stops growing once it reaches this" : "0 = no cap"} />
            <Slider label="Her income cap" value={s.herCap} setValue={set("herCap")} min={0} max={400000} step={10000} prefix="$" tint={C.sage}
              hint={s.herCap > 0 ? "Her salary stops growing once it reaches this" : "0 = no cap"} />
            <div className="sp-note" style={{ margin: "-4px 0 6px" }}>Growth compounds yearly off the prior value — unless a raise below pins an exact number or changes the rate from a given year. Caps hold the salary flat once hit.</div>
          </Section>

          <Section title="Retirement contributions" delay=".145s">
            <Slider label="Your 401(k) deferral" value={s.your401kAmt} setValue={set("your401kAmt")} min={0} max={24500} step={500} prefix="$" tint={C.sage}
              hint="Indexed to inflation across the projection; capped at the 2026 elective-deferral limit." />
            <Slider label="Your employer match" value={s.yourMatchPct} setValue={set("yourMatchPct")} min={0} max={12} step={0.5} suffix="% of base" tint={C.sage} />
            <Slider label="Her 401(k) deferral" value={s.her401kPct} setValue={set("her401kPct")} min={0} max={25} step={0.5} suffix="% of salary" tint={C.sage} />
            <Slider label="Her employer match" value={s.herMatchPct} setValue={set("herMatchPct")} min={0} max={12} step={0.5} suffix="% of salary" tint={C.sage} />
            <div className="sp-note" style={{ margin: "-4px 0 6px" }}>Deferral + match + ESOP per person is still capped at the §415(c) annual-additions limit.</div>
          </Section>

          <Section title="Raises &amp; overrides" delay=".15s"
            right={<button onClick={addOverride} className="sp-btn sp-btn--primary">+ Add raise</button>}>
            {ovs.length === 0 && (
              <div className="sp-note" style={{ fontSize: 12, marginBottom: 4 }}>
                No raises pinned. Add one to set an exact income in a given year (e.g. a promotion) — growth re-bases off that number for every later year, until the next raise. You can also pin a new growth/yr rate from a given year onward.
              </div>
            )}
            {ovs.map((o) => {
              const meta = OV_FIELDS[o.field] || OV_FIELDS.base;
              return (
                <div key={o.id} className="sp-ov">
                  <span className="sp-ov-yr">Yr</span>
                  <NumInput value={o.year} label="Year" onCommit={(v) => updOverride(o.id, "year", v)} min={1} max={years}
                    align="center" style={{ fontSize: 16 }} />
                  <select value={o.field} onChange={(e) => changeField(o, e.target.value)} className="sp-select" aria-label="Field">
                    {Object.keys(OV_FIELDS).map((k) => <option key={k} value={k}>{OV_FIELDS[k].label}</option>)}
                  </select>
                  <span className="sp-val sp-ov-val">
                    {!meta.pct && <span className="sp-unit">$</span>}
                    <NumInput value={o.value} label="Value" onCommit={(v) => updOverride(o.id, "value", v)} min={0}
                      max={meta.pct ? (meta.max || 100) : undefined} decimals={meta.pct} style={{ fontSize: 16 }} />
                    {meta.pct && <span className="sp-unit sp-suffix">%</span>}
                  </span>
                  <button onClick={() => delOverride(o.id)} aria-label="Remove raise" className="sp-x">×</button>
                </div>
              );
            })}
            {ovs.length > 0 && (
              <div className="sp-note" style={{ marginTop: 12 }}>
                A $ raise re-bases growth from that year; a % (bonus) holds until the next pin; a growth/yr change resets the compounding rate from that year onward. Pinned years are marked <span className="sp-pin">•</span> in the table below.
              </div>
            )}
          </Section>

          <Section title="Spending" delay=".16s">
            <Slider label="Fixed / month" value={s.fixedMo} setValue={set("fixedMo")} min={0} max={15000} step={100} prefix="$" suffix="/mo" hint={"= " + fmt(s.fixedMo * 12) + "/yr — rent, utilities, insurance & other recurring costs"} />
            <Slider label="Variable / month" value={s.varMo} setValue={set("varMo")} min={0} max={12000} step={100} prefix="$" suffix="/mo" />
            <Slider label="Big purchases / year" value={s.big} setValue={set("big")} min={0} max={60000} step={500} prefix="$" />
            <Slider label="Expense growth / yr" value={s.expGrow} setValue={set("expGrow")} min={0} max={10} step={0.5} suffix="%" tint={C.brass} />
          </Section>

          <Section title="Starting balances · projection" delay=".18s">
            <Slider label="Starting retirement balance" value={s.startRet} setValue={set("startRet")} min={0} max={2000000} step={25000} prefix="$" tint={C.sage} />
            <Slider label="Starting liquid balance" value={s.startLiq} setValue={set("startLiq")} min={0} max={1000000} step={10000} prefix="$" />
            <Slider label="Investment return / yr" value={s.invReturn} setValue={set("invReturn")} min={0} max={12} step={0.5} suffix="%" tint={C.brass} />
            <Slider label="Return scenario band ±" value={s.retBand} setValue={set("retBand")} min={0} max={4} step={0.5} suffix="%" tint={C.terra}
              hint={s.retBand > 0 ? `Chart shades returns from ${Math.max(0, s.invReturn - s.retBand)}% to ${s.invReturn + s.retBand}%.` : "Off — single-line projection."} />
            <Slider label="Tax drag on liquid" value={s.liqTaxDrag} setValue={set("liqTaxDrag")} min={0} max={40} step={1} suffix="% of gains" tint={C.brass}
              hint="Taxable-brokerage haircut on the liquid bucket's yearly growth. Retirement compounds tax-deferred." />
            <Slider label="Inflation (indexes tax & limits)" value={s.infl} setValue={set("infl")} min={0} max={6} step={0.1} suffix="%" tint={C.brass} />
            <Slider label="Years to project" value={s.years} setValue={set("years")} min={1} max={30} step={1} suffix="yrs" />
            <Toggle label="Show balances in" value={s.realDollars} setValue={set("realDollars")} on="Today's $" off="Nominal $" />
            <div className="sp-note" style={{ margin: "-8px 0 6px" }}>
              {s.realDollars
                ? `Every figure is deflated to today's buying power at your ${s.infl}% inflation rate.`
                : "Nominal — future dollars at face value. Switch to today's $ to see real buying power."}
            </div>
          </Section>

          <Section title="Base income · mortgage capacity" delay=".19s">
            <div className="sp-tiles">
              <div className="sp-tile" style={{ "--mark": C.brass }}>
                <div className="sp-tile-label">Qualifying · Yr 1</div>
                <div className="sp-tile-num">{fmt(m1.qualInc)}</div>
                <div className="sp-tile-sub">{s.inclBonus ? "base + bonus" : "base only"}</div>
              </div>
              <div className="sp-tile" style={{ "--mark": C.terra }}>
                <div className="sp-tile-label">Max PITI / mo{m1.pitiCapped ? " · capped" : ""}</div>
                <div className="sp-tile-num" style={{ color: C.terra }}>{fmt(m1.maxPITI)}</div>
                <div className="sp-tile-sub">{fmtC(m1.pi)} P&amp;I + {fmtC(m1.ti)} tax/ins{m1.pmiMo > 0 ? ` + ${fmtC(m1.pmiMo)} PMI` : ""}</div>
              </div>
            </div>
            <Toggle label="Count bonus as income" value={s.inclBonus} setValue={set("inclBonus")} on="With bonus" off="Base only" />
            <Slider label="Lender front-end ratio" value={s.feRatio} setValue={set("feRatio")} min={20} max={40} step={1} suffix="% of gross" tint={C.brass} />
            <Slider label="Cap PITI at" value={s.pitiCap} setValue={set("pitiCap")} min={0} max={15000} step={100} prefix="$" suffix="/mo" tint={C.sage}
              hint={s.pitiCap > 0 ? "Your ceiling — used whenever it's below the lender ratio." : "Off — lender ratio governs. Set a $/mo cap to limit your own payment."} />
            <Slider label="Mortgage rate (30-yr)" value={s.mortRate} setValue={set("mortRate")} min={2.5} max={9.5} step={0.125} suffix="%" tint={C.brass} />
            <Slider label="Property tax / yr" value={s.propTax} setValue={set("propTax")} min={0.5} max={2.5} step={0.05} suffix="% of value" tint={C.brass} />
            <Slider label="Insurance / yr" value={s.insRate} setValue={set("insRate")} min={0.1} max={1.5} step={0.05} suffix="% of value" tint={C.brass} />
            <Slider label="PMI rate (if under 20%)" value={s.pmiRate} setValue={set("pmiRate")} min={0} max={1.5} step={0.05} suffix="% of loan / yr" tint={C.brass} />
            <Slider label="Closing costs" value={s.closeCost} setValue={set("closeCost")} min={0} max={6} step={0.25} suffix="% of price" tint={C.brass} />
            <Slider label="Emergency fund to keep" value={s.emFund} setValue={set("emFund")} min={0} max={250000} step={5000} prefix="$" tint={C.sage} />
            <div className="sp-afford">
              <div className="sp-label">Affordable by year {years}</div>
              <div className="sp-afford-num">{fmtC(eY.affordHome)}</div>
              <div className="sp-afford-sub">
                {fmtC(eY.down)} down ({(eY.downPct * 100).toFixed(0)}%) + {fmtC(eY.loan)} loan
                {eY.closing > 0 && <span> · {fmtC(eY.closing)} closing</span>}
                {eY.pmiZone && <span style={{ color: C.warn }}> · {fmtC(eY.pmiMo)}/mo PMI</span>}
              </div>
            </div>
            <div className="sp-note">Assumes all liquid above your {fmtC(s.emFund)} emergency fund goes toward the purchase — closing costs ({s.closeCost}% of price) come out first, the rest is your down payment — then you borrow the most income supports (full PITI within {s.feRatio}%{s.pitiCap > 0 ? `, but never above your ${fmtC(s.pitiCap)}/mo cap` : ""}, with PMI added when down is under 20%). Retirement/ESOP aren't counted toward the down payment; HOA isn't included. A lender pre-approval is the real test.</div>
          </Section>

          <Section title="Year by year" delay=".2s"
            right={<div className="sp-actions">
              <button onClick={saveTableImage} className="sp-btn">↓ Save image</button>
              <button onClick={reset} className="sp-btn sp-btn--bad">Reset all</button>
            </div>}>
            <div className="sp-table-wrap">
              <table className="sp-table">
                <thead>
                  <tr>
                    <th rowSpan={2} style={{ padding: "8px 9px", textAlign: "left", fontWeight: 500, verticalAlign: "bottom", letterSpacing: ".06em", textTransform: "uppercase", fontSize: 10.5 }}>Yr</th>
                    <th colSpan={3} style={grp(C.brass)}>Income</th>
                    <th colSpan={3} style={grp(C.terra, true)}>Taxes</th>
                    <th rowSpan={2} style={{ padding: "8px 9px", textAlign: "right", fontWeight: 500, verticalAlign: "bottom", whiteSpace: "nowrap", borderLeft: HDIV, letterSpacing: ".06em", textTransform: "uppercase", fontSize: 10.5 }}>Spending</th>
                    <th colSpan={3} style={grp(C.sage, true)}>Savings</th>
                    <th colSpan={3} style={grp(C.terra, true)}>Balance</th>
                    <th colSpan={2} style={grp(C.brass, true)}>Housing</th>
                  </tr>
                  <tr style={{ color: C.mute }}>
                    <th style={sub()}>You</th><th style={sub()}>Her</th><th style={sub()}>Total</th>
                    <th style={sub(true)}>You</th><th style={sub()}>Her</th><th style={sub()}>Total</th>
                    <th style={sub(true)}>Liquid</th><th style={sub()}>Retire</th><th style={sub()}>Total</th>
                    <th style={sub(true)}>Liquid</th><th style={sub()}>Retire</th><th style={sub()}>Total</th>
                    <th style={sub(true)}>PITI/mo</th><th style={sub()}>Afford</th>
                  </tr>
                </thead>
                <tbody>
                  {proj.map((d, i) => (
                    <tr key={d.yr} style={{ background: i % 2 ? "var(--surface)" : "var(--ground)" }}>
                      <td style={{ padding: "7px 9px", fontWeight: 700, color: C.brass, whiteSpace: "nowrap" }} title={d.pinNote || undefined}>{d.yr}{d.pinned && <span style={{ color: C.terra }}> •</span>}</td>
                      <td style={bc()}>{fmtC(d.yourInc)}</td>
                      <td style={bc()}>{fmtC(d.herInc)}</td>
                      <td style={bc({ fontWeight: 700, color: C.ink })}>{fmtC(d.gross)}</td>
                      <td style={bc({ color: C.soft }, true)}>{fmtC(d.yourTax)}</td>
                      <td style={bc({ color: C.soft })}>{fmtC(d.herTax)}</td>
                      <td style={bc({ color: C.ink2, fontWeight: 700 })}>{fmtC(d.tax)}</td>
                      <td style={bc({}, true)}>{fmtC(d.spending)}</td>
                      <td style={bc({ color: d.liqSaved < 0 ? C.bad : C.ink2, fontWeight: 600 }, true)}>{fmtC(d.liqSaved)}</td>
                      <td style={bc({ color: C.sage, fontWeight: 600 })}>{fmtC(d.retSaved)}</td>
                      <td style={bc({ fontWeight: 700, color: C.ink })}>{fmtC(d.savedTot)}</td>
                      <td style={bc({ color: C.mute }, true)}>{fmtC(d.liqBalY)}</td>
                      <td style={bc({ color: C.sage })}>{fmtC(d.retBalY)}</td>
                      <td style={bc({ color: C.terra, fontWeight: 700 })}>{fmtC(d.bal)}</td>
                      <td style={bc({ color: C.ink }, true)}>{fmtC(d.maxPITI)}</td>
                      <td style={bc({ fontWeight: 700, color: d.pmiZone ? C.warn : C.sage })} title={d.pmiZone ? `down ${(d.downPct * 100).toFixed(0)}% — under 20%, PMI likely` : `down ${(d.downPct * 100).toFixed(0)}%`}>{fmtC(d.affordHome)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="sp-note">Scroll sideways for all groups. <b>Income</b> &amp; <b>Taxes</b> are split per person, then totaled. <b>Savings</b> = what you add that year (liquid + retirement); <b>Balance</b> = running total after that year's growth and contributions. <b>PITI/mo</b> = full housing payment income supports; <b>Afford</b> = home you can buy that year (all liquid above the e-fund as down + income-supported loan) — <span style={{ color: C.sage, fontWeight: 500 }}>green</span> = 20%+ down, <span style={{ color: C.warn, fontWeight: 500 }}>orange</span> = under 20%, PMI included. Tip: tap any input above to type an exact number.</div>
          </Section>

          <div className="sp-foot">
            Tax engine uses verified 2026 figures: IRS Rev. Proc. 2025-32 federal brackets, $16,100 standard deduction, $184,500 Social Security wage base, 1.45% + 0.9% Medicare, and $24,500 401(k) / $7,500 IRA / $72,000 §415(c) annual-additions limits — plus California's latest FTB single brackets, $5,706 standard deduction, and 1.3% SDI (no cap). Each spouse files single. Brackets and limits index by your inflation rate across the projection, so there's no artificial bracket creep. Each person's combined 401(k) deferral + employer match + ESOP is capped at the §415(c) limit; ESOP above it isn't contributed (not modeled as cash). Raises pinned in a given year override the smooth growth curve — a $ pin re-bases compounding from that year, a % (bonus) pin holds until the next pin, and a growth/yr pin changes the compounding rate from that year onward. Optional per-person income caps hold a salary flat once it reaches the ceiling. The liquid bucket compounds at an after-tax return (your tax-drag haircut on dividends &amp; realized gains); retirement compounds tax-deferred. Switch the projection to <b>today's dollars</b> to deflate every figure to current buying power, and set a <b>return band</b> to shade a ± scenario range around your point estimate. Not modeled: itemized deductions (e.g. mortgage interest & property tax once you own), pre-tax benefits like health premiums or HSA, catch-up contributions, and exact 2026 CA brackets (FTB finalizes those later). Inputs auto-save here but don't carry into a separate chat. Planning math — your actual tax return and a lender pre-approval are the real tests.
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SavingsCalculator />);
  </script>
</body>
</html>
